name: Build Warp Go TV MASQUE Ground Up Test E Service Core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 26.3.11579264
      PROJECT_DIR: hybrid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: unzip -q Warp-Go-TV-MASQUE-Ground-Up-Test-E-Service-Core-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Verify clean MASQUE source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bad = []
          for p in Path('masque_native').rglob('*'):
              if not p.is_file():
                  continue
              try:
                  s = p.read_text(errors='ignore')
              except Exception:
                  continue
              if any('\u4e00' <= ch <= '\u9fff' for ch in s):
                  bad.append(str(p))
          if bad:
              raise SystemExit('Unexpected Chinese text/source in clean MASQUE module: ' + ', '.join(bad))
          print('Clean MASQUE source check passed')
          PY

      - name: Build Test E MASQUE core arm64-v8a
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          go mod tidy
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          go build \
            -buildmode=c-shared \
            -trimpath \
            -o ../app/src/main/jniLibs/arm64-v8a/libmasquegraft.so \
            .

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk" \
             out/Warp-Go-TV-MASQUE-Ground-Up-Test-E-Service-Core.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Go-TV-MASQUE-Ground-Up-Test-E-Service-Core
          path: out/Warp-Go-TV-MASQUE-Ground-Up-Test-E-Service-Core.apk
          if-no-files-found: error

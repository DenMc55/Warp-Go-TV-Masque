name: Build Warp Go TV Test U MASQUE Fresh Session

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 26.3.11579264
      PROJECT_DIR: hybrid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Test U source
        run: unzip -q Warp-Go-TV-MASQUE-Test-U-Masque-Fresh-Session-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare preinstalled Android SDK
        run: |
          set -e
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android NDK
        run: |
          set -e
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Prepare Go modules
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        run: go mod tidy

      - name: Build clean MASQUE core arm64-v8a
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          go build -buildmode=c-shared -trimpath \
            -o ../app/src/main/jniLibs/arm64-v8a/libwarpmasque.so .

      - name: Build clean MASQUE core armeabi-v7a
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm
          GOARM: '7'
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
        run: |
          mkdir -p ../app/src/main/jniLibs/armeabi-v7a
          go build -buildmode=c-shared -trimpath \
            -o ../app/src/main/jniLibs/armeabi-v7a/libwarpmasque.so .

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp "${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk" \
             out/Warp-Go-TV-MASQUE-Test-U-Masque-Fresh-Session.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Go-TV-MASQUE-Test-U-Masque-Fresh-Session
          path: out/Warp-Go-TV-MASQUE-Test-U-Masque-Fresh-Session.apk
          if-no-files-found: error

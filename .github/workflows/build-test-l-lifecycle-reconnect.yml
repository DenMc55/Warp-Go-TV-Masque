name: Build Warp Go TV MASQUE Test L Lifecycle Reconnect

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 26.3.11579264
      PROJECT_DIR: hybrid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Test L source
        run: unzip -q Warp-Go-TV-MASQUE-Test-L-Lifecycle-Reconnect-source.zip

      - name: Verify Test I UI baseline and sandboxing
        run: |
          set -e
          test -f "${PROJECT_DIR}/app/src/main/res/layout/activity_tv.xml"
          test -f "${PROJECT_DIR}/app/src/main/res/layout/activity_mobile.xml"
          grep -q 'portSectionTitle.visibility = visibility' "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          grep -q 'portGroup.visibility = visibility' "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          grep -q 'private const val PREFS = "warp_reg"' "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/WarpManager.kt"
          grep -q 'masque_clean_reg.json' "${PROJECT_DIR}/masque_native/bridge.go"

      - name: Verify Test K task workaround is absent
        run: |
          set -e
          if grep -RIn 'moveTaskToFront\|REORDER_TASKS' "${PROJECT_DIR}/app/src/main"; then
            echo 'Test K task-reordering code leaked into Test L.'
            exit 1
          fi
          grep -q 'android:launchMode="singleTop"' "${PROJECT_DIR}/app/src/main/AndroidManifest.xml"

      - name: Verify Test L MASQUE lifecycle changes
        run: |
          set -e
          grep -q 'ACTION_STOP' "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MasqueVpnService.kt"
          grep -q 'START_NOT_STICKY' "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MasqueVpnService.kt"
          grep -q 'instance non-null until onDestroy' "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MasqueManager.kt"
          grep -q 'state.running = false' "${PROJECT_DIR}/masque_native/bridge.go"

      - name: Verify clean-room MASQUE source
        run: |
          set -e
          if grep -RInP '[\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{F900}-\x{FAFF}]' \
              "${PROJECT_DIR}/masque_native" \
              "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MasqueCore.kt" \
              "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MasqueManager.kt" \
              "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MasqueVpnService.kt"; then
            echo 'Unexpected CJK text found in clean-room MASQUE implementation.'
            exit 1
          fi
          if grep -RIn 'MasqueGraft\|masquegraft' \
              "${PROJECT_DIR}/masque_native" \
              "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo"; then
            echo 'Old graft implementation reference found.'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Prepare Go modules
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        run: go mod tidy

      - name: Build clean MASQUE core arm64-v8a
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          go build -buildmode=c-shared -trimpath \
            -o ../app/src/main/jniLibs/arm64-v8a/libwarpmasque.so .

      - name: Build clean MASQUE core armeabi-v7a
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm
          GOARM: '7'
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
        run: |
          mkdir -p ../app/src/main/jniLibs/armeabi-v7a
          go build -buildmode=c-shared -trimpath \
            -o ../app/src/main/jniLibs/armeabi-v7a/libwarpmasque.so .

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp "${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk" \
             out/Warp-Go-TV-MASQUE-Test-L-Lifecycle-Reconnect.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Go-TV-MASQUE-Test-L-Lifecycle-Reconnect
          path: out/Warp-Go-TV-MASQUE-Test-L-Lifecycle-Reconnect.apk
          if-no-files-found: error

name: Build Warp Go TV MASQUE Graft Test 2 Rev2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 26.3.11579264
      PROJECT_DIR: hybrid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract graft source
        run: unzip -q Warp-Go-TV-MASQUE-Graft-Test2-Rev2-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Build MASQUE VPN native arm64-v8a
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          go mod tidy
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          go build -tags with_gvisor -buildmode=c-shared -trimpath \
            -o ../app/src/main/jniLibs/arm64-v8a/libmasquegraft.so .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk" \
             out/Warp-Go-TV-MASQUE-Graft-Test2-Rev2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Go-TV-MASQUE-Graft-Test2-Rev2
          path: out/Warp-Go-TV-MASQUE-Graft-Test2-Rev2.apk
          if-no-files-found: error

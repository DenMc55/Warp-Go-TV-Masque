name: Build Warp Go TV Test I - WireGuard Stay Open Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 26.3.11579264
      PROJECT_DIR: hybrid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract exact Test I based source
        run: unzip -q Warp-Go-TV-MASQUE-Test-I-WireGuard-Stay-Open-Only-source.zip

      - name: Guard against regression from Test I
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('hybrid')
          allowed = {
              'app/src/main/AndroidManifest.xml',
              'app/src/main/java/com/iknalos/warpgo/MainActivity.kt',
          }
          expected = 'ea816a44a00c8da632fbf2dc82297b4d50a5d9b2296554002dc25c746361764d'
          rows = []
          for p in sorted(root.rglob('*')):
              if not p.is_file():
                  continue
              rel = p.relative_to(root).as_posix()
              if rel in allowed:
                  continue
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}\n")
          actual = hashlib.sha256(''.join(rows).encode()).hexdigest()
          if actual != expected:
              raise SystemExit(
                  'Regression guard failed: a Test I file outside the two allowed '
                  'WireGuard UI-foreground files has changed.\n'
                  f'Expected {expected}\nActual   {actual}'
              )
          print('PASS: every Test I file except the two intentional UI-foreground files is byte-identical.')
          PY

      - name: Verify the only intended WireGuard UI fix
        run: |
          set -e
          grep -q 'android.permission.REORDER_TASKS' "${PROJECT_DIR}/app/src/main/AndroidManifest.xml"
          grep -q 'android:launchMode="singleTask"' "${PROJECT_DIR}/app/src/main/AndroidManifest.xml"
          grep -q 'ActivityManager' "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          grep -q 'moveTaskToFront(taskId, 0)' "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          grep -q 'keepUiInForegroundAfterWireGuardConnect' "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"

      - name: Verify Test I MASQUE remains untouched
        run: |
          set -e
          grep -q 'Proto:  "cf-connect-ip"' "${PROJECT_DIR}/masque_native/bridge.go"
          grep -q 'masqueConnectHost.*cloudflareaccess.com' "${PROJECT_DIR}/masque_native/bridge.go"
          grep -q 'AdditionalSettings: map\[uint64\]uint64{0x276: 1}' "${PROJECT_DIR}/masque_native/bridge.go"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Prepare Go modules
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        run: go mod tidy

      - name: Build Test I MASQUE core arm64-v8a unchanged
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          go build -buildmode=c-shared -trimpath \
            -o ../app/src/main/jniLibs/arm64-v8a/libwarpmasque.so .

      - name: Build Test I MASQUE core armeabi-v7a unchanged
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm
          GOARM: '7'
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
        run: |
          mkdir -p ../app/src/main/jniLibs/armeabi-v7a
          go build -buildmode=c-shared -trimpath \
            -o ../app/src/main/jniLibs/armeabi-v7a/libwarpmasque.so .

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp "${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk" \
             out/Warp-Go-TV-Test-I-WireGuard-Stay-Open-Only.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Go-TV-Test-I-WireGuard-Stay-Open-Only
          path: out/Warp-Go-TV-Test-I-WireGuard-Stay-Open-Only.apk
          if-no-files-found: error

name: Build Warp Go TV Test N 1800ms WireGuard Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 26.3.11579264
      PROJECT_DIR: hybrid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Test N source
        run: unzip -q Warp-Go-TV-MASQUE-Test-N-1800ms-WireGuard-Release-source.zip

      - name: Verify Test N MASQUE to WireGuard 1800ms release
        run: |
          set -e
          grep -q 'awaitMasqueFullyDown' "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          grep -q 'MASQUE_TO_WIREGUARD_RELEASE_MS = 1800L' "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          grep -q 'MASQUE_HANDOVER_CONFIRM_ATTEMPTS = 50' "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          MAIN="${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          grep -q 'PROTOCOL_HANDOVER_SETTLE_MS = 1800L' "$MAIN"
          grep -q 'delay(PROTOCOL_HANDOVER_SETTLE_MS)' "$MAIN"
          grep -q 'CONNECT_TIMEOUT_MS = 10_000L' "$MAIN"
          grep -q 'withTimeout(CONNECT_TIMEOUT_MS)' "$MAIN"
          grep -q 'catch (_: TimeoutCancellationException)' "$MAIN"
          grep -q 'MasqueManager.disconnect(applicationContext)' "$MAIN"
          grep -q 'private fun updatePortControls()' "$MAIN"
          grep -q 'port4500.isEnabled = enabled' "$MAIN"
          grep -q 'port2408.isEnabled = enabled' "$MAIN"
          grep -q 'port500.isEnabled = enabled' "$MAIN"
          grep -q '!busy && !WarpManager.isUp(this)' "$MAIN"
          grep -q 'DISCONNECT_CONFIRM_POLL_MS = 100L' "$MAIN"
          grep -q 'DISCONNECT_CONFIRM_ATTEMPTS = 50' "$MAIN"
          grep -q 'WarpManager.connect(applicationContext, port)' "$MAIN"
          grep -q 'WarpManager.disconnect(applicationContext)' "$MAIN"
          if grep -RIn 'prepareWireGuardHandoff\|moveTaskToFront\|REORDER_TASKS' "${PROJECT_DIR}/app/src/main"; then
            echo 'Old WireGuard/MASQUE activity workaround leaked into Test N.'
            exit 1
          fi
          if grep -q 'android:launchMode="singleTask"' "${PROJECT_DIR}/app/src/main/AndroidManifest.xml"; then
            echo 'singleTask workaround must remain absent.'
            exit 1
          fi

      - name: Verify clean-room MASQUE source
        run: |
          set -e
          if grep -RInP '[\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{F900}-\x{FAFF}]' \
              "${PROJECT_DIR}/masque_native" \
              "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MasqueCore.kt" \
              "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MasqueManager.kt" \
              "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MasqueVpnService.kt"; then
            echo 'Unexpected CJK text found in clean-room MASQUE implementation.'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Prepare Go modules
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        run: go mod tidy

      - name: Build clean MASQUE core arm64-v8a
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          go build -buildmode=c-shared -trimpath \
            -o ../app/src/main/jniLibs/arm64-v8a/libwarpmasque.so .

      - name: Build clean MASQUE core armeabi-v7a
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm
          GOARM: '7'
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
        run: |
          mkdir -p ../app/src/main/jniLibs/armeabi-v7a
          go build -buildmode=c-shared -trimpath \
            -o ../app/src/main/jniLibs/armeabi-v7a/libwarpmasque.so .

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp "${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk" \
             out/Warp-Go-TV-MASQUE-Test-N-1800ms-WireGuard-Release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Go-TV-MASQUE-Test-N-1800ms-WireGuard-Release
          path: out/Warp-Go-TV-MASQUE-Test-N-1800ms-WireGuard-Release.apk
          if-no-files-found: error

name: Build Warp Go TV Test S Delayed Clean Restart

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 26.3.11579264
      PROJECT_DIR: hybrid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Test S source
        run: unzip -q Warp-Go-TV-MASQUE-Test-S-Delayed-Clean-Restart-source.zip

      - name: Verify Test S restart design
        run: |
          set -e
          MAIN="${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MainActivity.kt"
          grep -q 'versionName = "1.5-test-s-masque-wireguard-restart"' "${PROJECT_DIR}/app/build.gradle.kts"
          grep -q 'beginMasqueToWireGuardRestart' "$MAIN"
          grep -q 'RESTART_COUNTDOWN_SECONDS = 5' "$MAIN"
          grep -q 'Restarting for WireGuard in' "$MAIN"
          grep -q 'scheduleSelfRelaunch' "$MAIN"
          grep -q 'Process.killProcess(Process.myPid())' "$MAIN"
          grep -q 'PendingIntent.getActivity' "$MAIN"
          grep -q 'AlarmManager.ELAPSED_REALTIME_WAKEUP' "$MAIN"
          grep -q 'AppPreferences.setLastManualConnected(this, false)' "$MAIN"
          grep -q 'PROTOCOL_HANDOVER_SETTLE_MS = 1800L' "$MAIN"
          grep -q 'port4500.isEnabled = enabled' "$MAIN"
          grep -q 'port2408.isEnabled = enabled' "$MAIN"
          grep -q 'port500.isEnabled = enabled' "$MAIN"
          grep -q 'WarpManager.connect(applicationContext, port)' "$MAIN"
          if grep -RIn 'prepareWireGuardHandoff\|moveTaskToFront\|REORDER_TASKS' "${PROJECT_DIR}/app/src/main"; then
            echo 'Old activity/handoff workaround leaked into Test S.'
            exit 1
          fi

      - name: Verify separate protocol registrations
        run: |
          set -e
          grep -q 'private const val PREFS = "warp_reg"' "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/WarpManager.kt"
          grep -q 'masque_clean_reg.json' "${PROJECT_DIR}/masque_native/bridge.go"

      - name: Verify clean-room MASQUE source
        run: |
          set -e
          if grep -RInP '[\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{F900}-\x{FAFF}]' \
              "${PROJECT_DIR}/masque_native" \
              "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MasqueCore.kt" \
              "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MasqueManager.kt" \
              "${PROJECT_DIR}/app/src/main/java/com/iknalos/warpgo/MasqueVpnService.kt"; then
            echo 'Unexpected CJK text found in clean-room MASQUE implementation.'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare preinstalled Android SDK
        run: |
          set -e
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android NDK
        run: |
          set -e
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Prepare Go modules
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        run: go mod tidy

      - name: Build clean MASQUE core arm64-v8a
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          go build -buildmode=c-shared -trimpath \
            -o ../app/src/main/jniLibs/arm64-v8a/libwarpmasque.so .

      - name: Build clean MASQUE core armeabi-v7a
        working-directory: ${{ env.PROJECT_DIR }}/masque_native
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm
          GOARM: '7'
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
        run: |
          mkdir -p ../app/src/main/jniLibs/armeabi-v7a
          go build -buildmode=c-shared -trimpath \
            -o ../app/src/main/jniLibs/armeabi-v7a/libwarpmasque.so .

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp "${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk" \
             out/Warp-Go-TV-MASQUE-Test-S-Delayed-Clean-Restart.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Go-TV-MASQUE-Test-S-Delayed-Clean-Restart
          path: out/Warp-Go-TV-MASQUE-Test-S-Delayed-Clean-Restart.apk
          if-no-files-found: error
